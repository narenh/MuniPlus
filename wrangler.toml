name = "muniplus-backend"
main = "src/index.js"
compatibility_date = "2026-09-14"

# Static assets (data.json, bus.json, map.pdf) are served first; anything that
# doesn't match a file falls through to the Worker in src/index.js.
[assets]
directory = "appdata"

[vars]
# How long a stop's predictions are served from cache before going upstream.
# This is the freshness knob — tuning it is a redeploy, never an App Store release.
#
# It cannot be set below what the hourly budget can actually sustain, which is
# HOURLY_LIMIT divided by however many stops are being watched at once: with a
# five-stop dashboard running all day that is 450/5 = 90 fetches an hour per
# stop, one every 40 s. Asking faster than that does not buy freshness, it
# pins the budget at zero — and a stop that then finds its cache entry evicted
# has no fresh copy, no stale copy and no budget, so it fails outright.
TTL_SECONDS = 120
# Hard ceiling on calls to 511 per hour, across every client. 511 allows 500/hr
# on this key; the rest is headroom for app builds that still call 511 directly.
HOURLY_LIMIT = 450
# How long a copy is kept around to serve when the budget is spent or 511 is down.
STALE_SECONDS = 900

# --- GTFS-Realtime path (/gtfs/*) ---
#
# One poll of 511's TripUpdates feed serves every stop in the city, so unlike
# TTL_SECONDS above this is not divided by the number of stops being watched.
# It is the freshness of every stop at once, and it costs 60 calls an hour no
# matter how many clients are connected. The rest of the 500/hr key is left for
# app builds that still call 511 directly.
POLL_SECONDS = 60
# Predictions beyond this are for vehicles that have not started their run yet.
#
# This is a CPU knob, not just a content one. Because arrivals inside a trip are
# monotonic, the scan abandons a trip at the first arrival past this line rather
# than walking the rest of it, and that is the only thing that makes the walk
# cheaper -- protobuf cannot skip a field without reading its tag first. On a
# 683 KB feed: 3.88 ms at 90 min, 1.81 ms at 45. Coverage barely moves, 3,051
# of 3,061 stops still carry predictions at 45 min.
HORIZON_SECONDS = 2700

# TEMPORARY, REMOVE BEFORE THIS PATH SERVES ANYONE.
#
# /gtfs is a test deployment whose only reader is asleep between midnight and
# 09:00 Pacific, so it polls at a third of the rate through that window rather
# than spending the key on predictions nobody will look at.
#
# The hours are deliberately the wrong ones for a real transit app: 06:00-09:00
# Pacific is the morning commute, when riders need predictions most. That is
# fine only for as long as /gtfs has no riders on it -- they are on
# /transit/StopMonitoring, which has no quiet window and is unaffected. The day
# an app build points at /gtfs, delete QUIET_* here and pollInterval() in
# src/index.js, and let POLL_SECONDS stand on its own.
QUIET_POLL_SECONDS = 180
QUIET_FROM_HOUR = 0
QUIET_TO_HOUR = 9

# Workers Logs, off unless asked for. head_sampling_rate = 1 keeps every
# invocation rather than a sample, which matters here because the interesting
# invocation is the once-a-minute alarm, not the requests: sampling would throw
# away exactly the one whose CPU time is in question. Free plan carries 200k
# events a day against maybe 2k from this Worker, and keeps them 3 days.
[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[durable_objects.bindings]]
name = "FEED"
class_name = "Feed"

[[migrations]]
tag = "v1"
# new_sqlite_classes, NOT new_classes: the key-value storage backend for Durable
# Objects is paid-only, the SQLite backend is what's available on the free plan.
new_sqlite_classes = ["Budget"]

[[migrations]]
# Additive: Feed is a new class, Budget is untouched.
tag = "v2"
new_sqlite_classes = ["Feed"]
