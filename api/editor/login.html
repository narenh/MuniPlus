<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muni+ Editor · Log in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306070a'/%3E%3Cpath d='M8 22c0-8 4-12 8-12s8 4 8 12' stroke='%2300529C' stroke-width='3.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='22' r='3' fill='%23FAA633'/%3E%3Ccircle cx='24' cy='22' r='3' fill='%23D60F45'/%3E%3C/svg%3E">
<!-- Self-contained on purpose: this page must work before login and without the
     editor's scripts, so it copies the few colours it needs from css/app.css. -->
<style>
  :root {
    --bg: #06070a;
    --panel: #0e1016;
    --line: rgba(255, 255, 255, 0.09);
    --ink: #eef0f6;
    --ink-dim: #9aa1b4;
    --bad: #fb7185;
    --accent: #6ea8fe;
    --font: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid; place-items: center; min-height: 100vh;
    padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font: 14px/1.4 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  form {
    width: 100%; max-width: 320px;
    padding: 28px 24px 24px;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 20px 50px -12px rgba(0, 0, 0, .85);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .brand b { font-size: 15px; letter-spacing: .01em; }
  label { display: block; margin-bottom: 6px; color: var(--ink-dim); font-size: 12px; }
  input, button { font: inherit; width: 100%; border-radius: 10px; }
  input {
    padding: 10px 12px; color: var(--ink);
    background: rgba(255, 255, 255, .045);
    border: 1px solid var(--line); outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    margin-top: 14px; padding: 10px 12px;
    border: none; cursor: pointer; font-weight: 600;
    background: var(--accent); color: #06070a;
  }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 1.4em; margin: 12px 0 0; color: var(--bad); font-size: 12px; }
  .map { display: block; margin-top: 16px; color: var(--ink-dim); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<form id="login">
  <div class="brand">
    <svg width="26" height="20" viewBox="0 0 56 38" fill="none" aria-hidden="true">
      <path d="M6 30C6 14 14 7 24 7s16 8 16 23" stroke="#00529C" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M16 31c0-12 6-18 14-18s14 7 14 18" stroke="#FAA633" stroke-width="5.5" stroke-linecap="round" opacity=".9"/>
      <circle cx="6" cy="30" r="4.5" fill="#D60F45"/><circle cx="44" cy="31" r="4.5" fill="#008552"/>
    </svg>
    <b>Muni+ Editor</b>
  </div>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Log in</button>
  <p id="msg" role="alert"></p>
  <a class="map" href="/map/">View the public map instead</a>
</form>
<script>
  const form = document.getElementById('login');
  const msg = document.getElementById('msg');
  const button = form.querySelector('button');

  // The session cookie is SameSite=Strict, so arriving here from a link on another
  // site sends no cookie even when the session is fine, and the server redirects
  // here. A request from this page is same-site and does carry it: if the editor
  // page answers without redirecting, the session is good, so go straight there.
  fetch('./', { redirect: 'manual', credentials: 'same-origin' })
    .then((res) => { if (res.ok) location.replace('./'); })
    .catch(() => {});

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    msg.textContent = '';
    try {
      const res = await fetch('login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ password: form.password.value }),
      });
      if (res.ok) {
        location.replace('./');
        return;
      }
      const problem = await res.json().catch(() => null);
      msg.textContent = (problem && problem.message) || `Login failed (HTTP ${res.status}).`;
      form.password.select();
    } catch {
      msg.textContent = 'Could not reach the server.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
